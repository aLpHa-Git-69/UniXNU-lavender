name: Lavender Windows PE

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lavender-winpe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  winpe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential clang lld llvm uuid-dev acpica-tools nasm device-tree-compiler mtools cabextract msitools p7zip-full
      - name: Prepare pinned sources
        run: |
          git submodule update --init --depth 1 -- UniXNU uefi-lavender ios-lavender
          git -C UniXNU submodule update --init --depth 1 -- drivers/DarwinBoot
          git -C uefi-lavender submodule update --init --depth 1 -- Mu_Basecore Common/Mu Common/Mu_OEM_Sample Binaries Silicium-ACPI
          python3 -m pip install -r uefi-lavender/pip-requirements.txt
      - name: Verify handoff, RAM disk and memory descriptors
        run: python3 tests/windows-checks.py
      - name: Build Windows-profile firmware
        run: python3 scripts/build-stage1.py --config windows-firmware.toml --target DEBUG --out out/windows-firmware -j 4
      - name: Audit firmware ISA
        run: python3 scripts/audit-isa.py --fd out/windows-firmware/SILICIUM_UEFI.fd
      - name: Fetch verified Microsoft ARM64 WinPE inputs
        run: python3 scripts/fetch-winpe-inputs.py
      - name: Build and verify temporary WinPE image
        run: python3 scripts/build-winpe-boot.py
      - uses: actions/upload-artifact@v4
        with:
          name: lavender-winpe-ramboot
          path: |
            out/windows-winpe/lavender-winpe.img
            out/windows-winpe/SHA256SUMS
            out/windows-winpe/boot.json
            out/windows-winpe/build-report.json
            out/windows-inputs/Microsoft-EULA.rtf
            out/windows-inputs/input-report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lavender-winpe-build-logs
          path: |
            out/windows-checks/
            out/windows-firmware/SILICIUM_UEFI.fd
            out/windows-firmware/build-report.json
            out/windows-firmware/isa-audit.json
            out/windows-firmware/SHA256SUMS
            out/windows-firmware/empty/
            out/windows-firmware/payload/
            out/windows-firmware/LavenderProbe.efi
            out/windows-firmware/stage1-payload.img
            out/windows-firmware/logs/
            out/windows-winpe/commands.json
          if-no-files-found: warn
