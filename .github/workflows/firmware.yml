name: Lavender firmware

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/firmware.yml'
      - '.gitmodules'
      - 'firmware.toml'
      - 'package/**'
      - 'scripts/**'
      - 'tests/**'
      - 'UniXNU'
      - 'uefi-lavender'
      - 'ios-lavender'

permissions:
  contents: read

concurrency:
  group: lavender-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential clang lld llvm uuid-dev acpica-tools nasm device-tree-compiler mtools
      - name: Prepare pinned source checkouts
        run: |
          git submodule update --init --depth 1 -- UniXNU uefi-lavender ios-lavender
          git -C UniXNU submodule update --init --depth 1 -- drivers/DarwinBoot
          git -C uefi-lavender submodule update --init --depth 1 -- Mu_Basecore Common/Mu Common/Mu_OEM_Sample Binaries Silicium-ACPI
          python3 -m pip install -r uefi-lavender/pip-requirements.txt
      - name: Verify loader ABI and handoff
        run: python3 tests/darwin-checks.py --sanitize --output out/darwinboot-checks
      - name: Build and verify firmware
        run: python3 scripts/build-stage1.py --target DEBUG --out out/firmware -j 4
      - name: Audit firmware ISA
        run: python3 scripts/audit-isa.py --fd out/firmware/SILICIUM_UEFI.fd
      - uses: actions/upload-artifact@v4
        with:
          name: lavender-uefi
          path: |
            out/firmware/SILICIUM_UEFI.fd
            out/firmware/LavenderProbe.efi
            out/firmware/build-report.json
            out/firmware/isa-audit.json
            out/firmware/SHA256SUMS
            out/firmware/empty/
            out/firmware/payload/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lavender-firmware-logs
          path: |
            out/firmware/logs/
            out/darwinboot-checks/commands.json
            out/darwinboot-checks/report.json
          if-no-files-found: warn
